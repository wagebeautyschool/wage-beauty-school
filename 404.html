<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0c0b10">
  <title>Not found — Wage Beauty School</title>
  <meta name="description" content="That page could not be found.">
  <style>
    /* 404 is deliberately self-contained: no external CSS or JS dependency, so
       it renders correctly no matter what path GitHub Pages serves it from. */
    :root {
      --paper: #0c0b10; --ink: #e9e7f0; --ink-soft: #a6a2b6;
      --rule: #262232; --accent: #b79cff;
      color-scheme: dark light;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --paper: #faf9fd; --ink: #16131f; --ink-soft: #4c475c;
        --rule: #e2ddf0; --accent: #6d3bd4;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: 1.125rem; line-height: 1.65;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    .bar {
      border-bottom: 1px solid var(--rule); padding: 1.25rem 1.5rem;
      font-family: "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.8rem; letter-spacing: 0.24em; text-transform: uppercase;
    }
    .bar a { color: inherit; text-decoration: none; }
    main { flex: 1; max-width: 42rem; margin: 0 auto; padding: 4rem 1.5rem; }
    .kicker {
      font-family: "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-soft); margin: 0 0 1.4rem;
    }
    h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.15; margin: 0 0 1rem; letter-spacing: -0.015em; }
    p { color: var(--ink-soft); max-width: 36ch; }
    a { color: var(--accent); }
    footer {
      border-top: 1px solid var(--rule); padding: 2rem 1.5rem; color: var(--ink-soft);
      font-family: "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.76rem; letter-spacing: 0.04em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="bar"><a href="/" data-root="">Wage Beauty School</a></div>
  <main>
    <p class="kicker">Error 404</p>
    <h1>That page is not in the catalogue.</h1>
    <p>The school is still being built, so some doors lead nowhere yet.
    Try the <a href="/library.html" data-root="library.html">Library</a> or return
    <a href="/" data-root="">home</a>.</p>
  </main>
  <footer>Wage Beauty School · A living school for creative engineers</footer>

  <script>
    /* Repoint links at the real site root whether this is served from a domain
       root or a GitHub Pages project subpath (…github.io/<repo>/…). Without JS,
       the plain "/" links above still work on a custom domain or user site. */
    (function () {
      var host = location.hostname;
      var seg = location.pathname.split("/")[1] || "";
      var onProjectPage = /\.github\.io$/.test(host) && seg && seg + ".github.io" !== host;
      var base = onProjectPage ? "/" + seg + "/" : "/";
      var links = document.querySelectorAll("[data-root]");
      for (var i = 0; i < links.length; i++) {
        links[i].setAttribute("href", base + links[i].getAttribute("data-root"));
      }
    })();
  </script>
</body>
</html>
